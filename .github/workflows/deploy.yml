# CI/CD: main ga har bir push'da
#   1) testlar (go vet + go test),
#   2) Docker image yig'ilib GHCR (ghcr.io) ga yuklanadi,
#   3) SSH orqali VPS da yangi image bilan bot qayta ishga tushiriladi.
# Pull request'larda faqat testlar ishlaydi.
#
# Barcha sozlamalar "document creator bot env" GitHub environmentida
# (Settings → Environments). Deploy uchun:
#   VPS_HOST         — VPS IP manzili yoki domeni (majburiy, secret yoki variable)
#   VPS_SSH_KEY      — deploy uchun maxsus SSH kalitning PRIVATE qismi (majburiy, secret)
#   VPS_USER         — SSH foydalanuvchisi (ixtiyoriy, standart root)
#   VPS_PORT         — SSH porti (ixtiyoriy, standart 22)
#   VPS_KNOWN_HOSTS  — `ssh-keyscan <host>` natijasi (ixtiyoriy, lekin tavsiya etiladi)
#   DEPLOY_PATH      — VPS dagi loyiha papkasi (ixtiyoriy variable, standart /opt/document_creator)
# Qolgan barcha secret va variable'lar (TELEGRAM_BOT_TOKEN, DB_PASSWORD, ...) har
# deployda VPS dagi .env fayliga yoziladi.
#
# Batafsil: docs/DEPLOY.md

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# main ga ketma-ket push qilinsa, deploylar navbat bilan bajariladi (yarim yo'lda to'xtatilmaydi).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Testlar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:
    name: Docker image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      # GHCR faqat kichik harfli nomlarni qabul qiladi.
      - name: Image nomi
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Yig'ish va yuklash
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
            ${{ steps.vars.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: VPS ga deploy
    needs: build
    runs-on: ubuntu-latest
    environment: "document creator bot env"
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/document_creator' }}
      SSH_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v5

      - name: SSH sozlash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'root' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS || vars.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::VPS_HOST yoki VPS_SSH_KEY \"document creator bot env\" environmentida topilmadi (docs/DEPLOY.md)"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          # Windows qator oxirlari (\r) va bir qatorga "\n" bilan yozilgan kalit tuzatiladi.
          key="${SSH_KEY//$'\r'/}"
          if [[ "$key" != *$'\n'* && "$key" == *'\n'* ]]; then key="${key//\\n/$'\n'}"; fi
          printf '%s\n' "$key" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Kalit yaroqliligini tekshirish (kalit matni logga chiqarilmaydi).
          if ! err="$(ssh-keygen -y -P "" -f ~/.ssh/deploy_key 2>&1 > ~/.ssh/deploy_key.pub)"; then
            case "$(head -n1 ~/.ssh/deploy_key)" in
              ssh-*|ecdsa-*) hint="bu PUBLIC kalit (.pub). Secretga .pub siz faylning matnini kiriting" ;;
              PuTTY-User-Key-File*) hint="bu PuTTY (.ppk) formati, OpenSSH formatidagi kalit kerak" ;;
              -----BEGIN*PRIVATE\ KEY-----)
                if [[ "$err" == *passphrase* ]]; then hint="kalit parol bilan himoyalangan — parolsiz kalit yarating (ssh-keygen -N \"\")"
                else hint="kalit buzilgan yoki to'liq ko'chirilmagan — BEGIN va END qatorlari bilan butun faylni kiriting"; fi ;;
              *) hint="kalit '-----BEGIN ... PRIVATE KEY-----' qatori bilan boshlanishi kerak" ;;
            esac
            echo "::error::VPS_SSH_KEY yaroqsiz: $hint"
            exit 1
          fi
          echo "VPS dagi ~/.ssh/authorized_keys da shu public kalit bo'lishi kerak:"
          cat ~/.ssh/deploy_key.pub

          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS berilmagan — server kaliti ssh-keyscan orqali olinadi"
            ssh-keyscan -p "$SSH_PORT" "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            PasswordAuthentication no
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ConnectTimeout 20
          EOF

      - name: VPS ga ulanishni tekshirish
        env:
          VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'root' }}
        run: |
          if ! ssh vps true; then
            echo "::error::VPS kalitni qabul qilmadi: yuqoridagi public kalit VPS dagi /home/$VPS_USER/.ssh/authorized_keys (root uchun /root/.ssh/authorized_keys) ga qo'shilmagan yoki VPS_USER/VPS_HOST noto'g'ri"
            exit 1
          fi
          if ! ssh vps 'docker info >/dev/null 2>&1 && docker compose version >/dev/null 2>&1'; then
            echo "::error::VPS da docker/docker compose ishlamayapti yoki $VPS_USER docker guruhida emas (sudo usermod -aG docker $VPS_USER)"
            exit 1
          fi
          ssh vps 'echo "Ulanildi: $(whoami)@$(hostname), $(docker compose version)"'

      # Environmentdagi variable va secretlardan VPS uchun .env yig'iladi (deploy/make-env.sh).
      - name: .env yaratish
        id: dotenv
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          rc=0
          keys="$(bash deploy/make-env.sh "$RUNNER_TEMP/app.env")" || rc=$?
          case "$rc" in
            0) echo ".env ga yoziladigan sozlamalar: $keys"
               echo "upload=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "::notice::Environmentda TELEGRAM_BOT_TOKEN yo'q — VPS dagi mavjud .env ishlatiladi"
               echo "upload=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: Fayllarni VPS ga nusxalash
        env:
          UPLOAD_ENV: ${{ steps.dotenv.outputs.upload }}
        run: |
          set -euo pipefail
          ssh vps "mkdir -p '$DEPLOY_PATH'"
          scp docker-compose.yml deploy/remote-deploy.sh "vps:$DEPLOY_PATH/"
          if [ "$UPLOAD_ENV" = "true" ]; then
            ssh vps "cd '$DEPLOY_PATH' && umask 077 && cat > .env.new \
              && { [ ! -f .env ] || cp -p .env .env.bak; } && mv .env.new .env" < "$RUNNER_TEMP/app.env"
            echo ".env yangilandi (oldingisi .env.bak da)"
          fi

      - name: Botni yangilash
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Token buyruq qatorida ko'rinmasligi uchun stdin orqali uzatiladi.
          printf '%s' "$GHCR_TOKEN" | ssh vps \
            "cd '$DEPLOY_PATH' && IMAGE='$IMAGE' GHCR_USER='$GHCR_USER' bash remote-deploy.sh"

      - name: Maxfiy fayllarni o'chirish
        if: always()
        run: rm -f ~/.ssh/deploy_key "$RUNNER_TEMP/app.env"
